<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDC Capital — Betting Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="manifest" href="brand/site.webmanifest">
  <meta name="theme-color" content="#0A0D12">

  <!-- Manrope + JetBrains Mono (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Design System CSS -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <!-- Theme init: aplica tema salvo antes do render para evitar flash -->
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<div id="root"></div>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>

<!-- App — ordem de carregamento respeitada com defer -->
<script src="assets/js/data.js"              defer></script>
<script src="assets/js/filters.js"           defer></script>
<script src="assets/js/charts/shared.js"     defer></script>
<script src="assets/js/charts/gestao.js"     defer></script>
<script src="assets/js/charts/overview.js"   defer></script>
<script src="assets/js/charts/temporal.js"   defer></script>
<script src="assets/js/charts/performance.js" defer></script>
<script src="assets/js/charts/apostas.js"    defer></script>
<script src="assets/js/app.js"               defer></script>

</body>
</html>
