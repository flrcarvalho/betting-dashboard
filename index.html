<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDC Capital — Betting Dashboard</title>

  <!-- Favicon: canvas-based, converte branco→transparente e ícone→#1E90FF -->
  <link rel="icon" type="image/png" sizes="32x32" href="brand/14_favicon_32px.png">
  <script>
  (function(){var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=c.height=32;var ctx=c.getContext('2d');ctx.drawImage(img,0,0,32,32);var d=ctx.getImageData(0,0,32,32);var px=d.data;for(var i=0;i<px.length;i+=4){var br=(px[i]+px[i+1]+px[i+2])/3;if(br>220){px[i+3]=0;}else{px[i]=30;px[i+1]=144;px[i+2]=255;}}ctx.putImageData(d,0,0);var lnk=document.querySelector('link[rel="icon"]');if(!lnk){lnk=document.createElement('link');lnk.rel='icon';document.head.appendChild(lnk);}lnk.type='image/png';lnk.href=c.toDataURL();};img.src='brand/18_favicon_512px.png';})();
  </script>

  <!-- Manrope + JetBrains Mono (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Design System CSS -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <!-- Theme init: aplica tema salvo antes do render para evitar flash -->
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<div id="root"></div>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>

<!-- App — ordem de carregamento respeitada com defer -->
<script src="assets/js/data.js"    defer></script>
<script src="assets/js/filters.js" defer></script>
<script src="assets/js/charts.js"  defer></script>
<script src="assets/js/app.js"     defer></script>

</body>
</html>
